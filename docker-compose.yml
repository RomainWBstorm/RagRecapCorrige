services:
  postgres:
    image: postgres:17
    container_name: exo-recap-rag-psql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cours_rag
    ports:
      - 5433:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant:latest
    container_name: exo-recap-rag-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - 6333:6333
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pg_data:
  qdrant_data: