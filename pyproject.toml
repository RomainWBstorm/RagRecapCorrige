[project]
name = "rag-recap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rwauman", email = "romain.wauman@bstorm.be" }
]
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.3",
    "docling>=2.94",
    "fastapi>=0.162.0",
    "jupyterlab>=4.6.4",
    "openai>=3.39.0",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=2.0",
    "qdrant-client>=1.20.0",
    "ranx>=0.3.21",
    "streamlit>=1.66.1",
    "transformers>=5.17.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-recap = "rag_recap:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
