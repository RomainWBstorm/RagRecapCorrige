healthCheckTimeout: 300

macros:
  models_dir: "${env.HOME}/models"

models:
  qwen3.8-27b:
    cmd: |
      llama-server --port ${PORT}
      -m ${models_dir}/qwen3.8-27b/llama/Qwen3.8-27B-UD-Q4_K_XL.gguf
      -ngl 99 -fa on
      --parallel 4 --ctx-size 32768
      -ctk q8_0 -ctv q8_0
      --spec-type draft-mtp --spec-draft-n-max 4

  gemma-4-26b:
    cmd: |
      llama-server --port ${PORT}
      -m ${models_dir}/gemma4-26b-a4b/llama/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      -ngl 99 -fa on
      --parallel 1 --ctx-size 8196
      -ctk q8_0 -ctv q8_0
      --model-draft ${models_dir}/gemma4-26b-a4b/llama/mtp-gemma-4-26B-A4B-it.gguf
      --spec-type draft-mtp --spec-draft-n-max 4
